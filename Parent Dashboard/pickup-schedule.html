<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickup Point &amp; Schedule Card — AIUB BMS Parent Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="pickup-schedule.css" />
  </head>
  <body>
    <div class="card-preview-wrapper">
      <section class="pickup-schedule-card" aria-labelledby="pickup-heading">
        <div class="feature-card-header">
          <h2 id="pickup-heading" class="feature-card-title">Pickup Point &amp; Schedule</h2>
          <span class="feature-meta mono">Route RT-04</span>
        </div>

        <div class="feature-card-body">
          <div class="highlight-box">
            <span class="highlight-kicker">Designated Boarding Point</span>
            <strong class="highlight-main">Dhanmondi 27 (Rapa Plaza Gate)</strong>
            <span class="highlight-sub mono">Morning: 08:00 AM &middot; Return: 04:30 PM</span>
          </div>

          <table class="mini-table">
            <thead>
              <tr>
                <th>Day</th>
                <th>Pickup</th>
                <th>Return</th>
                <th class="text-right">Seat</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Sun – Tue</td>
                <td class="mono">08:00 AM</td>
                <td class="mono">04:30 PM</td>
                <td class="mono text-right">B-04</td>
              </tr>
              <tr class="active-table-row">
                <td><strong>Wed (Today)</strong></td>
                <td class="mono">08:00 AM</td>
                <td class="mono">04:30 PM</td>
                <td class="mono text-right">B-04</td>
              </tr>
              <tr>
                <td>Thursday</td>
                <td class="mono">08:00 AM</td>
                <td class="mono">03:30 PM</td>
                <td class="mono text-right">B-04</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </body>
</html>
