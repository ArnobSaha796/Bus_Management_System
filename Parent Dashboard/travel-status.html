<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Status Monitoring Card — AIUB BMS Parent Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="travel-status.css" />
  </head>
  <body>
    <div class="card-preview-wrapper">
      <section class="travel-status-card" aria-labelledby="travel-heading">
        <div class="feature-card-header">
          <h2 id="travel-heading" class="feature-card-title">Travel Status Monitoring</h2>
          <span class="feature-meta text-green">Pass Verified</span>
        </div>

        <div class="feature-card-body">
          <div class="highlight-box">
            <div class="highlight-row">
              <span class="highlight-kicker">Today's Morning Shift</span>
              <span class="highlight-kicker mono">28 Oct 2026</span>
            </div>
            <strong class="highlight-main text-amber">In Transit to AIUB Campus</strong>
            <span class="highlight-sub mono">Boarded at 07:56 AM &middot; Seat B-04</span>
          </div>

          <dl class="compact-list">
            <div class="compact-row">
              <dt>Digital Pass ID</dt>
              <dd class="mono">AIUB-PASS-2026-8841</dd>
            </div>
            <div class="compact-row">
              <dt>27 Oct Return</dt>
              <dd class="text-green">Arrived (05:22 PM)</dd>
            </div>
            <div class="compact-row">
              <dt>27 Oct Morning</dt>
              <dd class="text-green">Arrived (08:47 AM)</dd>
            </div>
            <div class="compact-row">
              <dt>Helper Contact</dt>
              <dd class="mono">+880 1819-554210</dd>
            </div>
          </dl>
        </div>
      </section>
    </div>
  </body>
</html>
