<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Booking History - AIUB BMS</title>
  <link rel="stylesheet" href="bookings.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="bms-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <div class="brand-logo">
            <i class="fa-solid fa-bus"></i>
          </div>
          <div class="brand-text">
            <h1>AIUB BMS</h1>
            <span>STUDENT PANEL</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Student Dashboard Navigation">
          <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="user-info">
            <p class="user-email">student@student.aiub.edu</p>
            <span class="user-role">Student</span>
          </div>
        </div>
        <button type="button" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Log Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="bookings-wrapper">
        <h2 class="bookings-title">My Booking History</h2>
        <div id="booking-banner" role="status" hidden style="padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:16px;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;"></div>

        <div class="table-container">
          <table class="booking-table">
            <thead>
              <tr>
                <th>Booking Date</th>
                <th>Route Info</th>
                <th>Bus &amp; Time</th>
                <th>Seat Number</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" class="empty-message">
                  You have not booked any seats yet!
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="booking-actions">
          <a href="schedules.html" class="btn-primary-outline">Book Another Seat</a>
          <a href="index.html" class="btn-secondary-solid">Back to Dashboard</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';
      function loadJson(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var parsed = JSON.parse(raw);
          return parsed != null ? parsed : fallback;
        } catch (_e) {
          return fallback;
        }
      }
      function escapeHtml(val) {
        return String(val == null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      var session = loadJson('aiub_bms_session', null);
      if (!session || typeof session !== 'object' || session.role !== 'student') {
        window.location.replace('../Login page/login.html?role=student');
        return;
      }

      var studentId =
        session.studentId ||
        (/^\d{2}-\d{5}-\d$/.test(session.identifier || '') ? session.identifier : '');
      var email = session.email || (studentId ? studentId + '@student.aiub.edu' : '');
      var bookingsKey = studentId
        ? 'aiub_bms_student_bookings_' + studentId
        : 'aiub_bms_student_bookings';

      var emailEl = document.querySelector('.sidebar-footer .user-email');
      var roleEl = document.querySelector('.sidebar-footer .user-role');
      if (emailEl && email) emailEl.textContent = email;
      if (roleEl && studentId) roleEl.textContent = 'Student · ' + studentId;

      var banner = document.getElementById('booking-banner');
      var params = new URLSearchParams(window.location.search);
      if (params.get('booked') === '1' && banner) {
        banner.textContent = 'Seat booking confirmed and added to your booking history.';
        banner.hidden = false;
      }

      var tbody = document.querySelector('.booking-table tbody');

      function renderBookings() {
        var list = loadJson(bookingsKey, []);
        if (!Array.isArray(list)) list = [];
        if (!tbody) return;
        if (list.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="empty-message">You have not booked any seats yet!</td></tr>';
          return;
        }
        tbody.innerHTML = list
          .map(function (b) {
            var isCancelled = b.status === 'Cancelled';
            var badgeStyle = isCancelled
              ? 'background:#fee2e2;color:#991b1b;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;'
              : 'background:#dcfce7;color:#166534;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;';
            var actionHtml = isCancelled
              ? '<span style="color:#94a3b8;font-size:12px;">Cancelled</span>'
              : '<button type="button" data-cancel-id="' +
                escapeHtml(b.id) +
                '" style="background:#fff;color:#dc3545;border:1px solid #dc3545;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;">Cancel</button>';
            return (
              '<tr>' +
                '<td><strong>' + escapeHtml(b.date) + '</strong></td>' +
                '<td>' + escapeHtml(b.route) + '</td>' +
                '<td><strong>' + escapeHtml(b.bus) + '</strong> · ' + escapeHtml(b.time || '06:00') + '</td>' +
                '<td>Seat ' + escapeHtml(b.seat) + '</td>' +
                '<td><span style="' + badgeStyle + '">' + escapeHtml(b.status || 'Confirmed') + '</span></td>' +
                '<td>' + actionHtml + '</td>' +
              '</tr>'
            );
          })
          .join('');
      }

      if (tbody) {
        tbody.addEventListener('click', function (e) {
          var btn = e.target.closest('button[data-cancel-id]');
          if (!btn) return;
          var id = btn.getAttribute('data-cancel-id');
          var list = loadJson(bookingsKey, []);
          if (!Array.isArray(list)) return;
          var updated = list.map(function (b) {
            return b.id === id ? Object.assign({}, b, { status: 'Cancelled' }) : b;
          });
          try {
            localStorage.setItem(bookingsKey, JSON.stringify(updated));
          } catch (_e) {}
          if (banner) {
            banner.textContent = 'Booking has been cancelled.';
            banner.hidden = false;
          }
          renderBookings();
        });
      }

      var logoutBtn = document.querySelector('.btn-logout');
      if (logoutBtn) {
        var modal = document.createElement('div');
        modal.style.cssText =
          'position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000;';
        modal.innerHTML =
          '<div style="background:#fff;border-radius:12px;border-top:4px solid #ffb703;max-width:400px;width:100%;padding:24px;box-shadow:0 20px 40px rgba(15,23,42,.22);">' +
            '<h3 style="font-size:18px;font-weight:700;color:#003366;margin-bottom:8px;">Confirm Sign Out</h3>' +
            '<p style="font-size:13.5px;color:#475569;margin-bottom:20px;">Sign out of Student Panel (' + escapeHtml(email) + ')?</p>' +
            '<div style="display:flex;justify-content:flex-end;gap:10px;">' +
              '<button type="button" data-act="cancel" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;border:1px solid #cbd5e1;background:#f8fafc;color:#334155;">Cancel</button>' +
              '<button type="button" data-act="confirm" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;border:1px solid #dc3545;background:#dc3545;color:#fff;">Log Out</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(modal);
        logoutBtn.addEventListener('click', function () {
          modal.style.display = 'flex';
        });
        modal.addEventListener('click', function (e) {
          if (e.target === modal || e.target.getAttribute('data-act') === 'cancel') {
            modal.style.display = 'none';
          }
          if (e.target.getAttribute('data-act') === 'confirm') {
            try {
              localStorage.setItem('aiub_bms_session', 'signed_out');
            } catch (_e) {}
            window.location.href = '../Login page/login.html?role=student';
          }
        });
      }

      renderBookings();
    })();
  </script>
</body>
</html>
