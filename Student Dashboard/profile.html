<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile &amp; Pickup Point - AIUB BMS</title>
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="bms-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <div class="brand-logo">
            <i class="fa-solid fa-bus"></i>
          </div>
          <div class="brand-text">
            <h1>AIUB BMS</h1>
            <span>STUDENT PANEL</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Student Dashboard Navigation">
          <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="user-info">
            <p class="user-email">aritratesting2@gmail.com</p>
            <span class="user-role">Student</span>
          </div>
        </div>
        <button type="button" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Log Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="profile-wrapper">
        <h2 class="profile-heading">STUDENT PROFILE &amp; PICKUP SETTINGS</h2>

        <section class="profile-card">
          <div class="profile-header">
            <div>
              <h3>Aritra Mallick Joy (23-54310-3)</h3>
              <p>Faculty of Science &amp; Technology (CSE)</p>
            </div>
            <span class="approval-status">Admin Status: Approved</span>
          </div>

          <form action="index.html" class="profile-form">
            <div class="form-grid">
              <div class="form-group">
                <label for="full-name">Full Name</label>
                <input id="full-name" type="text" value="Aritra Mallick Joy" />
              </div>

              <div class="form-group">
                <label for="student-id">AIUB Student ID</label>
                <input id="student-id" type="text" value="23-54310-3" readonly class="readonly-input" />
              </div>

              <div class="form-group">
                <label for="student-email">University / Registered Email</label>
                <input id="student-email" type="email" value="aritratesting2@gmail.com" />
              </div>

              <div class="form-group">
                <label for="student-phone">Student Phone Number</label>
                <input id="student-phone" type="text" value="+880 1712-543103" />
              </div>

              <div class="form-group">
                <label for="pickup-point">Preferred Pickup Point</label>
                <select id="pickup-point">
                  <option selected>Kuril</option>
                  <option>Tongi</option>
                  <option>Board Bazar</option>
                  <option>Shibbari</option>
                  <option>Rampura</option>
                  <option>Mirpur 12</option>
                  <option>Dhanmondi 15</option>
                </select>
              </div>

              <div class="form-group">
                <label for="guardian-phone">Linked Parent / Guardian Contact</label>
                <input id="guardian-phone" type="text" value="+880 1819-223344" />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save">Save Profile Settings</button>
              <a href="index.html" class="btn-secondary">Back to Dashboard</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
